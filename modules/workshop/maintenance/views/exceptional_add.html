{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4" style="max-width: 1000px; margin: 0 auto;" dir="rtl">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3 px-4">
            <h5 class="mb-0 fw-bold">إضافة أمر صيانة استثنائية جديد</h5>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-light text-primary fw-semibold px-3 py-2">رقم الأمر: توليد تلقائي</span>
            </div>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">التاريخ <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="incident_datetime" id="exceptionalDateInput" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">الموضوع <span class="text-danger">*</span></label>
                        <input type="text" name="subject" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">الوصف <span class="text-danger">*</span></label>
                        <textarea name="description" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">الأسباب</label>
                        <textarea name="causes" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">تفاصيل أخرى</label>
                        <textarea name="other_details" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                {% include '_maintenance_photo_before.html' %}
                <div class="d-flex justify-content-end flex-wrap gap-2 mt-4 pt-3 border-top">
                    <a href="{{ url_for('workshop.maintenance.maintenance_list', m_type='exceptional') }}" class="btn btn-outline-secondary px-4 py-2 fw-semibold">
                        ↩ رجوع للقائمة
                    </a>
                    <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">حفظ أمر الصيانة الاستثنائية</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var dateInput = document.getElementById('exceptionalDateInput');
    if (dateInput && !dateInput.value) {
        var now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        dateInput.value = now.toISOString().slice(0, 16);
    }
});
</script>
{% include '_maintenance_image_uploads.html' %}
{% endblock %}
