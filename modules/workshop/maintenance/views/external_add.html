{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4" style="max-width: 1100px; margin: 0 auto;" dir="rtl">
    <div class="card shadow-sm border-0 rounded-3">
        <!-- شريط العنوان -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3 px-4">
            <h5 class="mb-0 fw-bold">
                🏢 إضافة أمر صيانة خارجي جديد
            </h5>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-light text-primary fw-semibold px-3 py-2" style="font-size: 0.85rem;">
                    🔢 رقم الأمر: توليد تلقائي (order_no)
                </span>
            </div>
        </div>

        <div class="card-body p-4">
            <form method="POST" action="" enctype="multipart/form-data">

                <!-- 1. المركبة (vehicle_id) ورقم اللوحة مع المزامنة التلقائية -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">كود / اختيار المركبة (vehicle_id) <span class="text-danger">*</span></label>
                        <select name="vehicle_id" id="vehicleCodeSelect" class="form-select" required onchange="syncByVehicleCode()">
                            <option value="">-- اختر المركبة --</option>
                            {% for v in vehicles %}
                                {% set v_id = v.get('id') or v.get('vehicle_code') or '' %}
                                {% set v_code = v.get('vehicle_code') or '' %}
                                {% set v_plate = v.get('plate_number') or '' %}
                                <option value="{{ v_id }}" data-plate="{{ v_plate }}" data-code="{{ v_code }}">
                                    {{ v_code }}{% if v_plate %} - (لوحة: {{ v_plate }}){% endif %}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">رقم اللوحة (تحديث متزامن)</label>
                        <select id="plateNumberSelect" class="form-select" onchange="syncByPlateNumber()">
                            <option value="">-- اختر رقم اللوحة --</option>
                            {% for v in vehicles %}
                                {% set v_id = v.get('id') or v.get('vehicle_code') or '' %}
                                {% set v_code = v.get('vehicle_code') or '' %}
                                {% set v_plate = v.get('plate_number') or '' %}
                                <option value="{{ v_id }}" data-code-val="{{ v_id }}">
                                    {{ v_plate }}{% if v_code %} - (كود: {{ v_code }}){% endif %}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- 2. نوع الصيانة - درجة الخطورة -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">نوع الصيانة (maintenance_type) <span class="text-danger">*</span></label>
                        <select name="maintenance_type" class="form-select" required>
                            {% for maintenance_type in reference_lists.external_maintenance_types %}
                            <option value="{{ maintenance_type }}" {% if maintenance_type == 'تصحيحية' %}selected{% endif %}>{{ maintenance_type }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">درجة الخطورة (severity)</label>
                        <select name="severity" class="form-select">
                            {% for severity in reference_lists.maintenance_severities %}
                            <option value="{{ severity }}" {% if severity == 'متوسطة' %}selected{% endif %}>{{ severity }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- 3. بيانات الورشة الخارجية (workshop_name, workshop_phone, workshop_location) -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">اسم الورشة الخارجية (workshop_name) <span class="text-danger">*</span></label>
                        <input type="text" name="workshop_name" class="form-control" list="externalWorkshopsList" required placeholder="اسم الورشة أو المركز الفني">
                        <datalist id="externalWorkshopsList">
                            {% for workshop in reference_lists.external_workshops %}
                            <option value="{{ workshop }}">
                            {% endfor %}
                        </datalist>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">رقم الورشة (workshop_phone)</label>
                        <input type="text" name="workshop_phone" class="form-control" placeholder="05XXXXXXXX">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">موقع الورشة (workshop_location)</label>
                        <input type="text" name="workshop_location" class="form-control" placeholder="المدينة / المنطقة / الحي">
                    </div>
                </div>

                <!-- 4. بيانات الإرسال والتكاليف المتوقعة (send_reason, send_datetime, responsible_person, expected_cost, expected_time) -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">سبب الإرسال للورشة (send_reason) <span class="text-danger">*</span></label>
                        <input type="text" name="send_reason" class="form-control" required placeholder="مثال: عدم توفر قطع غيار داخلية / توضيب...">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">تاريخ ووقت الإرسال (send_datetime) <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="send_datetime" id="sendDatetimeInput" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">المسؤول عن المتابعة (responsible_person)</label>
                        <input type="text" name="responsible_person" class="form-control" placeholder="اسم المهندس / المشرف">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">التكلفة المتوقعة (expected_cost)</label>
                        <input type="number" step="0.01" min="0" name="expected_cost" class="form-control" placeholder="0.00">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">الوقت المتوقع للإنجاز (expected_time)</label>
                        <input type="text" name="expected_time" class="form-control" placeholder="مثال: 5 أيام / أسبوع">
                    </div>
                </div>

                <!-- 5. وصف العطل - سبب العطل -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">وصف العطل (fault_description) <span class="text-danger">*</span></label>
                        <textarea name="fault_description" class="form-control" rows="3" required placeholder="وصف تفصيلي للخلل الفني..."></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">سبب العطل المتوقع (fault_cause)</label>
                        <textarea name="fault_cause" class="form-control" rows="3" placeholder="تحديد سبب العطل إن وجد..."></textarea>
                    </div>
                </div>

                <!-- 6. الملاحظات العامة -->
                <div class="row mb-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">ملاحظات إضافية (notes)</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="أي ملاحظات أو شروط خاصة بطلب الإرسال..."></textarea>
                    </div>
                </div>

                {% include '_maintenance_photo_before.html' %}

                <!-- زر الحفظ والتوليد -->
                <div class="d-flex justify-content-end flex-wrap gap-2 mt-4 pt-3 border-top">
                    <a href="{{ url_for('workshop.maintenance.maintenance_list', m_type='external') }}" class="btn btn-outline-secondary px-4 py-2 fw-semibold">
                        ↩ رجوع للقائمة
                    </a>
                    <button type="submit" class="btn btn-success px-5 py-2 fw-bold shadow-sm">
                        💾 حفظ وتوليد أمر الصيانة الخارجي
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var dateInput = document.getElementById('sendDatetimeInput');
    if (dateInput && !dateInput.value) {
        var now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        dateInput.value = now.toISOString().slice(0, 16);
    }
});

function syncByVehicleCode() {
    var codeSelect = document.getElementById('vehicleCodeSelect');
    var plateSelect = document.getElementById('plateNumberSelect');
    if (codeSelect && plateSelect) {
        plateSelect.value = codeSelect.value;
    }
}

function syncByPlateNumber() {
    var codeSelect = document.getElementById('vehicleCodeSelect');
    var plateSelect = document.getElementById('plateNumberSelect');
    if (codeSelect && plateSelect) {
        codeSelect.value = plateSelect.value;
    }
}
</script>
{% include '_maintenance_image_uploads.html' %}
{% endblock %}
