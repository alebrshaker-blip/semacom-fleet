{% extends "base.html" %}

{% block title %}إضافة عضو فريق عمل جديد - SEMACOM{% endblock %}

{% block extra_css %}
<style>
    .form-container { max-width: 950px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 25px; }
    .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #dee2e6; padding-bottom: 15px; }
    h2 { color: #2c3e50; margin: 0; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; font-size: 14px; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    .btn { display: inline-block; padding: 8px 16px; font-size: 14px; font-weight: bold; text-decoration: none; border-radius: 4px; cursor: pointer; border: none; transition: background 0.2s; }
    .btn-primary { background-color: #0d6efd; color: white; }
    .btn-primary:hover { background-color: #0b5ed7; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-secondary:hover { background-color: #5c636a; }
    .unique-feedback { display: block; margin-top: 5px; color: #b02a37; font-size: 13px; font-weight: 700; }
    .unique-feedback[hidden] { display: none; }
    .form-control.unique-invalid { border-color: #dc3545; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h2><i class="fa-solid fa-user-plus ml-2"></i> إضافة عضو فريق عمل جديد</h2>
    </div>

    <form action="{{ url_for('workshop.team.save_member') }}" method="POST">
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <div class="form-row">
            <div class="form-group">
                <label>الاسم الكامل <span style="color: red;">*</span></label>
                <input type="text" name="full_name" class="form-control" value="{{ form_data.get('full_name', '') if form_data else '' }}" data-unique-check="{{ url_for('workshop.team.check_duplicate_member') }}" data-unique-field="full_name" data-unique-feedback="teamNameFeedback" autocomplete="off" required placeholder="الاسم الرباعي">
                <small id="teamNameFeedback" class="unique-feedback" aria-live="polite" hidden></small>
            </div>
            <div class="form-group">
                <label>رقم الهوية <span style="color: red;">*</span></label>
                <input type="text" name="national_id" class="form-control" value="{{ form_data.get('national_id', '') if form_data else '' }}" data-unique-check="{{ url_for('workshop.team.check_duplicate_member') }}" data-unique-field="national_id" data-unique-feedback="teamNationalIdFeedback" autocomplete="off" required placeholder="رقم الهوية أو الإقامة">
                <small id="teamNationalIdFeedback" class="unique-feedback" aria-live="polite" hidden></small>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>الجنسية</label>
                <input type="text" name="nationality" class="form-control" placeholder="مثال: سعودي، ...">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="text" name="phone" class="form-control" placeholder="05xxxxxxxx">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>الصفة الوظيفية</label>
                <input type="text" name="job_title" class="form-control" placeholder="مثال: ميكانيكي، فني كهرباء">
            </div>
            <div class="form-group">
                <label>المؤهل</label>
                <input type="text" name="qualification" class="form-control" placeholder="مثال: بكالوريوس، دبلوم">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>التخصص</label>
                <input type="text" name="specialization" class="form-control" placeholder="مثال: محركات ديزل، تكييف وتبريد">
            </div>
            <div class="form-group">
                <label>رقم الرخصة</label>
                <input type="text" name="license_number" class="form-control" placeholder="رقم رخصة القيادة أو العمل">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>نوع الرخصة</label>
                <input type="text" name="license_type" class="form-control" placeholder="مثال: مهنية، قيادة، تخصصية">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>تاريخ إصدار الرخصة</label>
                <input type="date" name="license_issue_date" class="form-control">
            </div>
            <div class="form-group">
                <label>تاريخ انتهاء الرخصة</label>
                <input type="date" name="license_expiry_date" class="form-control">
            </div>
        </div>

        <div style="margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #dee2e6; padding-top: 15px;">
            <button type="submit" class="btn btn-primary">حفظ السجل</button>
            <a href="{{ url_for('workshop.team.team_index') }}" class="btn btn-secondary">إلغاء</a>
        </div>
    </form>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/unique_field_validator.js') }}"></script>
{% endblock %}
