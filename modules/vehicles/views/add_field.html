<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة حقل جديد</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            direction: rtl;
            text-align: right;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            padding: 15px 20px;
        }
        .card-header h4 {
            margin: 0;
            font-size: 18px;
        }
        .card-body {
            padding: 25px;
        }
        .mb-3 {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #2c3e50;
        }
        .form-control, .form-select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .text-muted {
            font-size: 12px;
            color: #6c757d;
            margin-top: 4px;
            display: block;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn-success { background-color: #198754; color: white; }
        .btn-success:hover { background-color: #157347; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5c636a; }
        .actions-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            border-top: 1px solid #dee2e6;
            padding-top: 20px;
        }
        @media (max-width: 767.98px) {
            body { padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); }
            .card-body { padding: 18px 14px; }
            .form-control, .form-select { min-height: 46px; font-size: 16px; }
            .actions-flex, .actions-flex > div { display: flex; width: 100%; align-items: stretch; flex-direction: column; gap: 8px; }
            .actions-flex .btn { display: flex; width: 100%; min-height: 46px; align-items: center; justify-content: center; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h4>إضافة حقل جديد لبيانات المركبة</h4>
            </div>
            <div class="card-body">
                
                <form action="/vehicles/save-field" method="POST">
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">اسم الحقل (بالإنجليزية بدون مسافات):</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="مثال: color" required>
                        <span class="text-muted">يستخدم برمجياً في قاعدة البيانات (حروف إنجليزية صغيرة).</span>
                    </div>

                    <div class="mb-3">
                        <label for="label" class="form-label">عنوان الحقل (Label بالعربية):</label>
                        <input type="text" class="form-control" id="label" name="label" placeholder="مثال: اللون" required>
                        <span class="text-muted">هو الاسم الذي سيظهر في الجداول ونماذج الإدخال.</span>
                    </div>

                    <div class="mb-3">
                        <label for="required" class="form-label">هل الحقل إلزامي عند الإدخال؟</label>
                        <select class="form-select" id="required" name="required">
                            <option value="0">اختياري</option>
                            <option value="1">إلزامي (اجباري)</option>
                        </select>
                    </div>

                    <div class="actions-flex">
                        <div>
                            <button type="submit" class="btn btn-success">حفظ الحقل للسستم</button>
                            <a href="/vehicles/add" class="btn btn-secondary">رجوع</a>
                        </div>
                    </div>

                </form>

            </div>
        </div>
    </div>

</body>
</html>
