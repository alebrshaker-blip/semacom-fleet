{% extends "base.html" %}

{% block title %}تقارير الصيانة{% endblock %}

{% block content %}
<div class="container py-4" dir="rtl" style="max-width: 1040px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-1">تقارير الصيانة</h2>
            <div class="text-muted">فلترة أوامر الصيانة ومعاينة التقرير قبل الطباعة أو الاعتماد</div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary" href="{{ url_for('workshop.maintenance.maintenance_all') }}">جدول جميع أوامر الصيانة</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('workshop.maintenance.maintenance_index') }}">أقسام الصيانة</a>
        </div>
    </div>

    <form class="card border shadow-sm" action="{{ url_for('reports.maintenance_reports') }}" method="GET" target="_blank">
        <input type="hidden" name="view" value="print">
        <div class="card-body p-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="maintenance-type">نوع الصيانة</label>
                    <select class="form-select" id="maintenance-type" name="type">
                        <option value="all" {{ 'selected' if filters.type == 'all' }}>جميع الأنواع</option>
                        {% for type_key, type_title in type_titles.items() %}
                        <option value="{{ type_key }}" {{ 'selected' if filters.type == type_key }}>{{ type_title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="maintenance-status">حالة الأمر</label>
                    <select class="form-select" id="maintenance-status" name="status">
                        <option value="all" {{ 'selected' if filters.status == 'all' }}>المفتوحة والمغلقة المؤرشفة</option>
                        <option value="open" {{ 'selected' if filters.status == 'open' }}>المفتوحة</option>
                        <option value="closed" {{ 'selected' if filters.status == 'closed' }}>المغلقة المؤرشفة</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="maintenance-date-from">من تاريخ</label>
                    <input class="form-control" id="maintenance-date-from" type="date" name="date_from" value="{{ filters.date_from }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="maintenance-date-to">إلى تاريخ</label>
                    <input class="form-control" id="maintenance-date-to" type="date" name="date_to" value="{{ filters.date_to }}">
                </div>
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
            <a class="btn btn-outline-secondary" href="{{ url_for('reports.maintenance_reports') }}">إعادة تعيين</a>
            <button class="btn btn-primary" type="submit">معاينة التقرير</button>
        </div>
    </form>
</div>
{% endblock %}
